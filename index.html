<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    /* Video de fondo */
    #video-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* Overlay oscuro para mejorar legibilidad */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
    }

    /* Contenedor principal */
    .container {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
    }

    /* Botones superiores */
    .top-buttons {
      position: absolute;
      top: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 30px;
      z-index: 10;
    }

    .social-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(255,255,255,0.8);
      transition: all 0.3s;
    }

    .social-btn:hover {
      transform: scale(1.1);
      border-color: white;
    }

    .social-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Botón principal */
    .main-button {
      margin-top: 100px;
      padding: 18px 50px;
      font-size: 24px;
      font-weight: bold;
      color: white;
      background: linear-gradient(45deg, #ff6b00, #ff8c00);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .main-button:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <!-- Video de fondo -->
  <video id="video-background" autoplay loop muted playsinline>
    <source src="fondo.mp4" type="video/mp4">
    Tu navegador no soporta videos.
  </video>

  <div class="overlay"></div>

  <!-- Botones superiores -->
  <div class="top-buttons">
    <!-- WhatsApp (Izquierda) -->
    <a href="https://wa.me/528717342078?text=necesito%20ayuda" target="_blank">
      <div class="social-btn">
        <img src="whats.png" alt="WhatsApp">
      </div>
    </a>

    <!-- Instagram (Derecha) -->
    <a href="https://instagram.com/TU_USUARIO" target="_blank"> <!-- ← Cambia TU_USUARIO -->
      <div class="social-btn">
        <img src="ig.png" alt="Instagram">
      </div>
    </a>
  </div>

  <!-- Contenido central -->
  <div class="container">
    <button class="main-button" onclick="window.location.href='provedores.html'">
      Ver Proveedores
    </button>
  </div>

</body>
</html>
