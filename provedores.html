  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Arial', sans-serif;
      background: #0f0f0f;
      color: white;
    }

    header {
      background: linear-gradient(135deg, #00aaff, #0088cc);
      text-align: center;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      position: relative;
    }

    .back-button {
      position: absolute;
      left: 25px;
      top: 25px;
      color: white;
      font-size: 1.1rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 15px;
      border-radius: 30px;
      background: rgba(255,255,255,0.15);
      transition: 0.3s;
    }
    .back-button:hover {
      background: rgba(255,255,255,0.3);
      transform: translateX(-5px);
    }

    .logo { max-width: 280px; height: auto; }
    header h1 { color: white; font-size: 2.4rem; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }

    .search-container {
      max-width: 500px;
      width: 100%;
      margin: 20px auto;
      position: relative;
    }
    .search-container input {
      width: 100%;
      padding: 15px 20px 15px 50px;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      background: white;
      color: #222;
    }
    .search-container input:focus {
      outline: none;
      box-shadow: 0 0 0 4px rgba(0, 170, 255, 0.3);
    }
    .lupa {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.4rem;
      color: #0088cc;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      height: 380px;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: transform 0.4s;
    }
    .card:hover { transform: scale(1.05); }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s;
    }
    .card:hover img { transform: scale(1.1); }

    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      padding: 40px 25px 25px;
      text-align: center;
    }
    .card h3 { font-size: 1.6rem; margin-bottom: 8px; }
    .giro { font-size: 1.1rem; opacity: 0.9; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #ffffff;
      color: #222;
      max-width: 1000px;
      width: 95%;
      border-radius: 20px;
      overflow: hidden;
      max-height: 92vh;
      box-shadow: 0 10px 30px rgba(0, 170, 255, 0.3);
    }
    .modal-header {
      background: linear-gradient(135deg, #00aaff, #0088cc);
      padding: 20px 25px;
      text-align: center;
      position: relative;
      color: white;
    }
    .close {
      position: absolute;
      top: 15px;
      right: 25px;
      font-size: 40px;
      cursor: pointer;
      color: white;
    }

    .modal-body {
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      overflow-y: auto;
      max-height: calc(92vh - 80px);
    }

    .modal-seccion-img {
      width: 100%;
      border-radius: 12px;
      cursor: zoom-in;
      max-height: 380px;
      object-fit: cover;
    }

    .modal-info {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      border-left: 5px solid #00aaff;
    }
    .modal-info h2 {
      color: #0088cc;
      margin-bottom: 15px;
      font-size: 1.9rem;
    }

    .modal-video video {
      width: 100%;
      border-radius: 12px;
      max-height: 420px;
    }

    .botones-modal {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-whats { background: #25D366; color: white; }
    .btn-ig { 
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); 
      color: white; 
    }
  </style>

    const grid = document.getElementById('proveedores-grid');
    const searchInput = document.getElementById('searchInput');

    function renderProveedores(filtered) {
      grid.innerHTML = '';
      if (filtered.length === 0) {
        grid.innerHTML = `<p style="color:white; text-align:center; grid-column:1/-1; padding:50px;">No se encontraron proveedores.</p>`;
        return;
      }
      filtered.forEach(p => {
        const cardHTML = `
          <div class="card" onclick="openModal(${p.id})">
            <img src="${p.imagen}" alt="${p.nombre}">
            <div class="overlay">
              <h3>${p.nombre}</h3>
              <p class="giro">${p.giro}</p>
            </div>
          </div>
        `;
        grid.innerHTML += cardHTML;
      });
    }

    searchInput.addEventListener('input', () => {
      const term = searchInput.value.toLowerCase().trim();
      if (term === '') {
        renderProveedores(proveedores);
        return;
      }
      const filtered = proveedores.filter(p => {
        const texto = (p.nombre + " " + p.giro + " " + (p.contacto || "") + " " + (p.keywords || "")).toLowerCase();
        return texto.includes(term);
      });
      renderProveedores(filtered);
    });

    renderProveedores(proveedores);

    function openModal(id) {
      const p = proveedores.find(prov => prov.id === id);
      if (!p) return;

      document.getElementById('modal-title').textContent = p.nombre;
      document.getElementById('modal-nombre').textContent = p.nombre;
      document.getElementById('modal-giro').textContent = p.giro;
      document.getElementById('modal-contacto').textContent = p.contacto;
      document.getElementById('modal-tel').textContent = p.tel;
      document.getElementById('modal-negocio').textContent = p.negocio || "—";

      document.getElementById('modal-seccion-img').src = p.imagenSeccion;

      const video = document.getElementById('modal-video');
      video.innerHTML = `<source src="${p.video}" type="video/mp4">`;
      video.load();

      document.getElementById('modal-ig-link').href = p.ig;
      document.getElementById('modal-whats-link').href = p.whats;

      document.getElementById('modal').style.display = "flex";
    }

    function closeModal() {
      document.getElementById('modal').style.display = "none";
      document.getElementById('modal-video').pause();
    }

    function zoomImage(img) {
      document.getElementById('zoomed-image').src = img.src;
      document.getElementById('image-zoom').style.display = "flex";
    }

    function closeZoom() {
      document.getElementById('image-zoom').style.display = "none";
